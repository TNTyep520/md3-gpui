[package]
name = "md3-gpui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 license"
description = "Material Design 3 component library for gpui"
repository = "https://github.com/TNTyep520/md3-gpui"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
anyhow = "1"
mcu-hct = { version = "0.2.1", registry = "rsproxy-sparse" }
mcu-palettes = { version = "0.2.0", registry = "rsproxy-sparse" }
mcu-dynamiccolor = { version = "0.2.4", registry = "rsproxy-sparse" }

[dev-dependencies]
# demo 示例需要平台启动层（zed 已将平台后端拆分为 gpui_platform）
# x11/wayland/font-kit/runtime_shaders 均为目标平台门控 feature，
# 在 Windows 上会自动忽略
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }

[[example]]
name = "demo"
